<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zwerg</title>
  <meta name="description" content="Zwerg – von der Idee zur Gründung.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F6F6F3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131416" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Zwerg">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="/zwerg/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/zwerg/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/zwerg/apple-touch-icon.png">
  <script>
    // Darstellung vor dem ersten Zeichnen setzen, damit nichts aufblitzt.
    try {
      var t = localStorage.getItem('zwerg-theme');
      if (t === 'hell' || t === 'dunkel') document.documentElement.dataset.theme = t;
      var a = localStorage.getItem('zwerg-accent');
      if (a) document.documentElement.dataset.accent = a;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
